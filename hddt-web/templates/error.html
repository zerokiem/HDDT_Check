{% extends "base.html" %}
{% block title %}Lỗi {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:5rem;">{% if code==404 %}🔍{% elif code==403 %}🔒{% else %}⚠️{% endif %}</div>
  <h1 class="display-4 fw-bold text-muted">{{ code }}</h1>
  <p class="lead text-muted">{{ msg }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
    <i class="bi bi-house me-1"></i>Về trang chủ
  </a>
</div>
{% endblock %}
