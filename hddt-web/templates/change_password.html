{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block breadcrumb %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5">
    <div class="card">
      <div class="card-header"><i class="bi bi-key me-2"></i>Đổi mật khẩu</div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('change_password') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Mật khẩu hiện tại</label>
            <input type="password" name="old_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Mật khẩu mới</label>
            <input type="password" name="new_password" class="form-control"
                   minlength="8" required placeholder="Ít nhất 8 ký tự">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Xác nhận mật khẩu mới</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>Đổi mật khẩu
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
